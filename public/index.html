<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة حملة فهد المطيري للحج</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#101c3a;--mut:#69748f;--line:#e4e8f1;--navy:#1d3a8a;--red:#b4232c;--ok:#16794a;--side:#0f1f52;--sh:0 1px 2px #10206a0d,0 4px 14px #10206a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141c36;--ink:#e8ecf7;--mut:#93a0bd;--line:#25304f;--navy:#7d9bff;--red:#ff7b83;--ok:#4cc38a;--side:#080d1f;--sh:none}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141c36;--ink:#e8ecf7;--mut:#93a0bd;--line:#25304f;--navy:#7d9bff;--red:#ff7b83;--ok:#4cc38a;--side:#080d1f;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--side),#142a6e);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;line-height:1.35;padding:2px 6px 18px;border-bottom:1px solid #ffffff1f;margin-bottom:14px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.65}
.mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b63d6,#b4232c);flex:none}
nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#ffffffb8;padding:10px 12px;border-radius:9px;font:inherit;cursor:pointer;margin-bottom:3px;transition:.15s}
nav button:hover{background:#ffffff12}nav button.on{background:#ffffff22;color:#fff;font-weight:700;box-shadow:inset -3px 0 0 #ff6b73}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
main{padding:20px 26px;min-width:0;max-width:1250px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.live{padding:3px 12px;border-radius:99px;background:var(--line)}.live.on{background:#16794a22;color:var(--ok)}.live.on:before{content:"● "}
h1{font-size:24px;margin:0 0 2px}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line);position:relative}
.kpi span{color:var(--mut);font-size:13px;display:block}.kpi b{font-size:30px;display:block;margin:2px 0 8px}.kpi small{font-size:15px;color:var(--mut);font-weight:400}
.kpi em{position:absolute;top:14px;left:14px;font-style:normal;font-size:12px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:right;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12.5px;background:var(--bg)}tbody tr:hover td,tr:hover td{background:#7d9bff0d}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{width:100%;min-height:120px}
.btn{font:inherit;border:0;border-radius:9px;padding:8px 15px;background:var(--navy);color:#fff;cursor:pointer;font-weight:500}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.o):not(.g){color:#0b1020}}
:root[data-theme="dark"] .btn:not(.o):not(.g){color:#0b1020}
.btn.g{background:#1f9d57;color:#fff}.btn.o{background:none;color:var(--navy);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line);color:var(--ink)}
.tag.ok{background:#16794a22;color:var(--ok)}.tag.no{background:#b4232c1f;color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--navy);border-radius:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bs{margin-bottom:14px}.bs div.l{display:flex;justify-content:space-between;margin-bottom:4px}
.fn{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin-bottom:10px}.fn b{text-align:left}
.att{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}.rm{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--bg)}.rm b{font-size:18px;display:block}.rm small{color:var(--mut);display:block;font-size:11px}.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--navy)}.rm.pa{border-color:var(--navy)}.rm.fu{border-color:var(--ok)}.rm.fu .dots i.on{background:var(--ok)}.rm.ov{border-color:var(--red);background:#b4232c14}.rm.ov .dots i.on{background:var(--red)}.lg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fl{margin-bottom:18px}.flh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:4px 8px;min-width:58px;cursor:pointer;line-height:1.25}.chip small{display:block;font-weight:400;font-size:11px;color:var(--mut)}.chip.pa{border-color:var(--navy)}.chip.fu{border-color:var(--ok);background:#16794a14}.chip.ov{border-color:var(--red);background:#b4232c14}
details.fd{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}details.fd>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}details.fd>summary::-webkit-details-marker{display:none}details.fd[open]>summary{border-bottom:1px solid var(--line)}details.fd .tw{padding:0 14px 8px}
img.mk{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:cover;flex:none;box-shadow:0 0 0 2px #ffffff40}
.rr{padding:4px 14px 10px}.rrow{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}.rrow:last-child{border-bottom:0}.rrow:hover{background:#7d9bff0d}.rrow.ov{background:#b4232c10}.rno{display:flex;gap:8px;align-items:center}.rno b{font-size:16px;min-width:42px}.rocc{display:flex;flex-wrap:wrap;gap:6px}.pc{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:13px;cursor:grab}.pc button{border:0;background:none;color:var(--red);cursor:pointer;font-size:17px;line-height:1;padding:0 2px 0 0}.racts{display:flex;gap:6px;align-items:center}.pool{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
@media(max-width:760px){.rrow{grid-template-columns:1fr}}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;padding:12px 14px}.rc{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}.rc.pa{border-color:var(--navy)}.rc.fu{border-color:var(--ok);background:#16794a10}.rc.ov{border-color:var(--red);background:#b4232c12}.rch{display:flex;justify-content:space-between;align-items:center}.rch b{font-size:18px}.rc .rocc{min-height:30px;align-content:flex-start}.rc .racts{margin-top:auto}
.pc.hl{background:#ffe27a;border-color:#e0a800;color:#2a2200}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.staff :is([onclick*="runAuto("],[onclick*="setup8("],[onclick*="busForm("],[onclick*="genRooms2("],[onclick*="setFloor("],[onclick*="capForm("],[onclick*="doCap("],[onclick*="genBuses("],[onclick*="delP("],[onclick*="roomDel("],[onclick*="busDel("],[onclick*="exportAll("],[onclick*="autoRoom("],[onclick*="autoSeat("],[onclick*="sendPending("],[onclick*="sendApi("],[onclick*="tplCsv("],label:has(input[onchange*="importAll"]),label:has(input[onchange*="impXl"])){display:none!important}
@media print{nav,.top{display:none}}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:10px}.brand{display:none}nav button{width:auto;white-space:nowrap;margin:0}main{padding:14px}}
</style>

function setFloor(){const s=+prompt('من رقم غرفة'),e=+prompt('إلى رقم غرفة'),f=prompt('اسم/رقم الدور');if(!s||!e||f===null)return;let n=0;S.rooms.forEach(r=>{const v=+r.no;if(v>=s&&v<=e){r.fl=f;n++}});save();draw();alert('تم تحديد الدور لـ '+n+' غرفة')}
function foldAll(o){document.querySelectorAll('details.fd').forEach(d=>d.open=o)}
function roomsTable(){if(!S.rooms.length)return '<p class="sub">لا توجد غرف بعد</p>';const g={};S.rooms.forEach((r,i)=>{const k=(r.hotel||'—')+'||'+(r.fl||'');(g[k]=g[k]||[]).push([r,i])});
return Object.keys(g).sort((a,b)=>a.localeCompare(b,'ar',{numeric:true})).map(k=>{const [h,f]=k.split('||'),l=g[k].sort((a,b)=>(+a[0].no||0)-(+b[0].no||0)),cap=l.reduce((a,x)=>a+x[0].cap,0),used=l.reduce((a,x)=>a+Math.min(occ(x[0].no),x[0].cap),0);
return `<details class="fd" open><summary><b>${f?'الدور '+esc(f):'بدون دور'}</b><span class="sub" style="margin:0;font-size:12.5px">${esc(l[0][0].no)}–${esc(l[l.length-1][0].no)} · ${l.length} غرفة · ${used}/${cap} سرير</span></summary><div class="tw"><table><tr><th>الغرفة</th><th>الإشغال</th><th>المقيمون</th><th></th></tr>${l.map(x=>{const r=x[0],o=occ(r.no);return `<tr><td>${esc(r.no)}</td><td><span class="tag ${o>r.cap?'no':o==r.cap?'ok':''}">${o}/${r.cap}</span></td><td>${S.pil.filter(p=>p.room==r.no).map(p=>esc(p.n)).join('، ')||'—'}</td><td><button class="btn o" onclick="editRoom(${x[1]})">تعديل</button></td></tr>`}).join('')}</table></div></details>`}).join('')}
function doSetup8(c){if(!c)return;const pat=Array.isArray(c)?c:Array(19).fill(c);
if(S.rooms.length&&!confirm('يوجد '+S.rooms.length+' غرفة حالية. سيتم استبدالها بالأدوار الثمانية (101–819) وسيُخرج المقيمون منها. متابعة؟'))return;
S.pil.forEach(x=>x.room='');S.rooms=[];for(let f=1;f<=8;f++)for(let k=1;k<=19;k++)S.rooms.push({no:String(f*100+k),hotel:HOTEL,fl:String(f),cap:pat[k-1]});save();closeM();alert('تم إنشاء 152 غرفة في 8 أدوار')}
function movePil(id){const p=S.pil.find(x=>x.id==id);if(!p)return;const cur=(S.rooms.find(r=>r.no==p.room)||{}).fl||'',by={};
S.rooms.forEach((r,i)=>{if(r.no==p.room)return;const k=r.fl||'';(by[k]=by[k]||[]).push([r,i])});
const ks=Object.keys(by).sort((a,b)=>(a!=cur)-(b!=cur)||(!a-!b)||a.localeCompare(b,'ar',{numeric:true}));
modal(`<h2>${esc(p.n)}</h2><p class="sub">${p.room?'الغرفة الحالية: '+esc(p.room):'بدون غرفة'} · ${esc(p.p)}</p><div class="row"><select id="mv" style="flex:1"><option value="">انقل إلى غرفة…</option>${ks.map(f=>`<optgroup label="${f?'الدور '+esc(f):'بدون دور'}">${by[f].sort((a,b)=>(+a[0].no||0)-(+b[0].no||0)).map(x=>{const fr=x[0].cap-occ(x[0].no);return `<option value="${x[1]}">${esc(x[0].no)} · ${tname(x[0].cap)} — ${fr>0?fr+' متاح':'مكتملة'}</option>`}).join('')}</optgroup>`).join('')}</select><button class="btn g" onclick="doMove(${id})">نقل</button></div><div class="row">${p.room?`<button class="btn o" style="color:var(--red)" onclick="roomOut2(${id});closeM()">إخراج من الغرفة</button>`:''}<span style="flex:1"></span><button class="btn o" onclick="closeM()">إغلاق</button></div>`)}
function doMove(id){const v=$('#mv').value;if(v==='')return;putRoom(id,+v);closeM()}
let ROLE='manager',UNDO=[],LAST='',LASTROOM='',LASTTYPE=0,TF=0;const STAFF_TABS=['home','pil','room','bus','bag'];
function undo(){const s=UNDO.pop();if(!s)return;const d=JSON.parse(s);
if(ROLE=='staff'&&(d.pil.length<S.pil.length||d.rooms.length<S.rooms.length||d.bus.length<S.bus.length)){UNDO.push(s);return alert('هذا التراجع يحتاج المدير')}
S=Object.assign(d,{tab:S.tab,auto:S.auto,tpl:S.tpl});LAST=snap();persist();draw()}
function setup8(){modal(`<h2>إنشاء أدوار التامور الثمانية</h2><p class="sub">الأدوار 1 إلى 8، كل دور من 01 إلى 19 (101–119، 201–219، … 801–819)</p><p class="sub">عدد الغرف من كل نوع في كل دور (المجموع 19). ترتب من أول الدور: الفردية ثم الثنائية ثم الثلاثية ثم الرباعية، وتقدر تعدّل أي غرفة بعدها.</p><div class="row"><label>فردية<br><input id="s1" type="number" value="0" style="width:80px"></label><label>ثنائية<br><input id="s2" type="number" value="0" style="width:80px"></label><label>ثلاثية<br><input id="s3" type="number" value="0" style="width:80px"></label><label>رباعية<br><input id="s4" type="number" value="19" style="width:80px"></label></div><div class="row"><button class="btn g" onclick="doSetup8s()">إنشاء</button><button class="btn o" onclick="closeM()">إلغاء</button></div>`)}
function busForm(){modal(`<h2>إنشاء الباصات</h2><div class="row"><label>عدد الباصات<br><input id="bf1" type="number" value="10" style="width:100px"></label><label>مقاعد كل باص<br><input id="bf2" type="number" value="45" style="width:100px"></label></div><div class="row"><label>الوجهة<br><input id="bf3" value="منى"></label><label>موعد التحرك<br><input id="bf4" type="datetime-local"></label></div><p class="sub">تقدر تعدّل كل باص بعد كده.</p><div class="row"><button class="btn g" onclick="doBuses()">إنشاء</button><button class="btn o" onclick="closeM()">إلغاء</button></div>`)}
function doBuses(){const n=+$('#bf1').value,c=+$('#bf2').value;if(!n||!c||n>100)return alert('أدخل عددًا صحيحًا');const d=$('#bf3').value.trim()||'—',t=$('#bf4').value||'',f=S.bus.length;for(let i=1;i<=n;i++)S.bus.push({no:String(f+i),time:t,cap:c,dest:d});save();closeM()}
function tplCsv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffالاسم,الهاتف,المجموعة,الجنس\nأحمد العنزي,51234567,عائلة 1,ذكر\nفاطمة العنزي,66123456,عائلة 1,أنثى\n'],{type:'text/csv'}));a.download='hajj-pilgrims-template.csv';a.click()}
function wizard(){if(ROLE=='staff')return '';const a=S.rooms.length>0,b=S.bus.length>0,c=S.pil.length>0;if(a&&b&&c)return '';
const st=(ok,t,d,btn)=>`<div class="att" style="cursor:default"><span><b>${ok?'✓ ':''}${t}</b><br><span class="sub" style="margin:0;font-size:12.5px">${d}</span></span>${ok?'<span class="tag ok">تم</span>':btn}</div>`;
return `<div class="box" style="border-color:var(--navy)"><h2>ابدأ الإعداد (3 خطوات)</h2>${st(a,'1. الغرف',a?S.rooms.length+' غرفة':'أنشئ الأدوار والغرف','<button class="btn g" onclick="setup8()">إنشاء الغرف</button>')}${st(b,'2. الباصات',b?S.bus.length+' باص':'أضف الباصات وعدد مقاعدها','<button class="btn g" onclick="busForm()">إنشاء الباصات</button>')}${st(c,'3. الحجاج',c?S.pil.length+' حاج':'استورد ملف Excel فيه الاسم والهاتف','<span><button class="btn o" onclick="tplCsv()">تنزيل نموذج</button> <label class="btn g" style="cursor:pointer">استيراد Excel<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="impXl(this)"></label></span>')}<p class="sub" style="margin:10px 0 0">بعد الخطوات الثلاث اضغط «تنفيذ التسكين والتوزيع» وسيوزّع النظام الجميع تلقائيًا.</p></div>`}
function roomOpts(t){const by={};S.rooms.forEach(r=>{if(t&&r.cap!=t)return;const k=r.fl||'';(by[k]=by[k]||[]).push(r)});return Object.keys(by).sort((a,b)=>(!a-!b)||a.localeCompare(b,'ar',{numeric:true})).map(f=>`<optgroup label="${f?'الدور '+esc(f):'بدون دور'}">${by[f].sort((a,b)=>(+a.no||0)-(+b.no||0)).map(r=>{const fr=r.cap-occ(r.no);return `<option value="${esc(r.no)}" ${fr<=0?'disabled':(r.no==LASTROOM?'selected':'')}>${esc(r.no)}${t?'':' · '+tname(r.cap)} — ${fr>0?fr+' متاح':'مكتملة'}</option>`}).join('')}</optgroup>`).join('')}
function tname(c){return {1:'فردية',2:'ثنائية',3:'ثلاثية',4:'رباعية',5:'خماسية'}[c]||c+' أسرّة'}
function typeStats(){const t={};S.rooms.forEach(r=>{const o=t[r.cap]||(t[r.cap]={cap:r.cap,rooms:0,free:0,beds:0,used:0});const n=occ(r.no);o.rooms++;o.beds+=r.cap;o.used+=Math.min(n,r.cap);if(n<r.cap)o.free++});return Object.values(t).sort((a,b)=>a.cap-b.cap)}
function typeBox(){const l=typeStats();if(!l.length)return '';return `<div class="box"><h2>أنواع الغرف</h2><div class="kpis" style="margin:0">${l.map(o=>`<div class="kpi" style="cursor:pointer" onclick="TF=${o.cap};draw()"><span>${tname(o.cap)}</span><b>${o.free}<small> غرفة متاحة من ${o.rooms}</small></b><div class="bar"><i style="width:${Math.round(o.used/o.beds*100)}%"></i></div><em>${o.used}/${o.beds} سرير</em></div>`).join('')}</div><p class="sub" style="margin:10px 0 0">اضغط على نوع لتشاهد غرفه فقط في قسم الأدوار.</p></div>`}
function typeOpts(){return typeStats().map(o=>`<option value="${o.cap}" ${LASTTYPE==o.cap?'selected':''}>${tname(o.cap)} — ${o.free} غرفة متاحة</option>`).join('')}
function pickRoom(t){const c=S.rooms.filter(r=>r.cap==t&&occ(r.no)<r.cap);c.sort((a,b)=>(occ(b.no)>0)-(occ(a.no)>0)||((+a.no||0)-(+b.no||0)));return c.length?c[0].no:''}
function atChg(){LASTTYPE=+($('#at').value||0);LASTROOM='';const e=$('#ar');if(e)e.innerHTML='<option value="">الغرفة (تلقائي من النوع)</option>'+roomOpts(LASTTYPE)}
function doSetup8s(){const caps=[];[1,2,3,4].forEach(i=>{const n=+$('#s'+i).value||0;for(let k=0;k<n;k++)caps.push(i)});if(caps.length!=19)return alert('المجموع لازم يكون 19 غرفة في كل دور (الحالي '+caps.length+')');doSetup8(caps)}
function capForm(){modal(`<h2>تحديد نوع الغرف لنطاق</h2><div class="row"><label>من غرفة<br><input id="cf1" type="number" style="width:100px"></label><label>إلى غرفة<br><input id="cf2" type="number" style="width:100px"></label><label>النوع<br><select id="cf3"><option value="1">فردية</option><option value="2">ثنائية</option><option value="3">ثلاثية</option><option value="4" selected>رباعية</option></select></label></div><p class="sub">لو غرفة فيها نزلاء أكثر من النوع الجديد، تظهر باللون الأحمر لتنقل منها.</p><div class="row"><button class="btn g" onclick="doCap()">تطبيق</button><button class="btn o" onclick="closeM()">إلغاء</button></div>`)}
function doCap(){const a=+$('#cf1').value,b=+$('#cf2').value,c=+$('#cf3').value;if(!a||!b||b<a)return alert('أدخل نطاقًا صحيحًا');let n=0;S.rooms.forEach(r=>{const v=+r.no;if(v>=a&&v<=b){r.cap=c;n++}});save();closeM();alert('تم تحديد غرف '+tname(c)+' لـ '+n+' غرفة')}
let FQ='';
const nz=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function floorsPanel(){return `<div class="row"><input id="fs" value="${esc(FQ)}" placeholder="ابحث برقم الغرفة أو اسم الحاج أو رقم هاتفه" oninput="FQ=this.value;fpDraw()" style="flex:1;min-width:220px"><select onchange="TF=+this.value;fpDraw()" aria-label="نوع الغرفة"><option value="0">كل الأنواع</option>${typeStats().map(o=>`<option value="${o.cap}" ${TF==o.cap?'selected':''}>${tname(o.cap)}</option>`).join('')}</select><button class="btn o" onclick="FQ='';draw()">مسح</button></div><div id="fp">${floorsInner()}</div>`}
function fpDraw(){const e=$('#fp');if(e)e.innerHTML=floorsInner()}
let OPEN={};
function pcHtml(p,x){const hl=FQ&&nz(FQ)&&(nz(p.n).includes(nz(FQ))||String(p.p).includes(nz(FQ)));return `<span class="pc${hl?' hl':''}" draggable="true" title="${esc(p.p)}" ondragstart="event.dataTransfer.setData('text','${p.id}')"><span onclick="movePil(${p.id})" style="cursor:pointer" title="نقل أو إخراج">${esc(p.n)}</span>${x?`<button title="إخراج من الغرفة" onclick="roomOut2(${p.id})">×</button>`:''}</span>`}
function floorsInner(){if(!S.rooms.length)return '<p class="sub">لا توجد غرف بعد.</p><button class="btn g" onclick="setup8()">إنشاء أدوار التامور الثمانية (101–819)</button>';
const q=nz(FQ),mp=p=>!q||nz(p.n).includes(q)||String(p.p).includes(q),un=S.pil.filter(x=>!x.room&&mp(x)),g={};S.rooms.forEach((r,i)=>{if(TF&&r.cap!=TF)return;if(q&&!(String(r.no).includes(q)||S.pil.some(p=>p.room==r.no&&mp(p))))return;const k=r.fl||'';(g[k]=g[k]||[]).push([r,i])});const op=k=>(q||OPEN[k])?'open':'';
const pool=`<details class="fd" ${op('#pool')} data-k="#pool" ontoggle="OPEN[this.dataset.k]=this.open" ondragover="event.preventDefault()" ondrop="dropTo(event,-1)"><summary><b>بدون غرفة</b><span class="sub" style="margin:0;font-size:12.5px">${un.length} حاج</span></summary><div class="pool">${un.slice(0,80).map(p=>pcHtml(p,0)).join('')||'<span class="tag ok">كل الحجاج مُسكَّنون</span>'}${un.length>80?`<span class="sub" style="margin:0">+${un.length-80} آخرين</span>`:''}</div></details>`;
if(q&&!un.length&&!Object.keys(g).length)return '<p class="sub">لا نتائج لـ «'+esc(FQ)+'»</p>';return (q&&!un.length?'':pool)+Object.keys(g).sort((a,b)=>(!a-!b)||a.localeCompare(b,'ar',{numeric:true})).map(f=>{const l=g[f].sort((a,b)=>(+a[0].no||0)-(+b[0].no||0)),cap=l.reduce((a,x)=>a+x[0].cap,0),used=l.reduce((a,x)=>a+Math.min(occ(x[0].no),x[0].cap),0),ov=l.some(x=>occ(x[0].no)>x[0].cap);
return `<details class="fd" ${op(f)} data-k="${esc(f)}" ontoggle="OPEN[this.dataset.k]=this.open"><summary><b>${f?'الدور '+esc(f):'بدون دور'}</b><span class="sub" style="margin:0;font-size:12.5px">${esc(l[0][0].no)}–${esc(l[l.length-1][0].no)} · ${l.length} غرفة · ${used}/${cap} سرير</span><div class="bar" style="flex-basis:100%"><i style="width:${cap?Math.round(used/cap*100):0}%;${ov?'background:var(--red)':''}"></i></div></summary><div class="rg">${l.map(x=>{const r=x[0],i=x[1],o=S.pil.filter(p=>p.room==r.no);return `<div class="rc ${o.length>r.cap?'ov':o.length==r.cap?'fu':o.length?'pa':''}" ondragover="event.preventDefault()" ondrop="dropTo(event,${i})"><div class="rch"><b>${esc(r.no)}</b><small class="sub" style="margin:0">${tname(r.cap)}</small><span class="tag ${o.length>r.cap?'no':o.length==r.cap?'ok':''}">${o.length}/${r.cap}</span></div><div class="rocc">${o.map(p=>pcHtml(p,1)).join('')||'<span class="sub" style="margin:0">فارغة</span>'}</div><div class="racts"><span id="ad${i}"><button class="btn o" onclick="addTo(${i})">+ إضافة</button></span><button class="btn o" onclick="editRoom(${i})">تعديل</button></div></div>`}).join('')}</div></details>`}).join('')}
function addTo(i){const e=$('#ad'+i);if(!e)return;const un=S.pil.filter(x=>!x.room).sort((a,b)=>a.n.localeCompare(b.n,'ar'));e.innerHTML=`<select onchange="placeIn(${i},this.value)"><option value="">اختر حاجًا…</option>${un.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select>`;if(e.firstChild)e.firstChild.focus()}
function placeIn(i,v){if(v)putRoom(+v,i)}
function putRoom(id,i){const r=S.rooms[i],x=S.pil.find(p=>p.id==id);if(!x||!r||x.room==r.no)return;if(occ(r.no)>=r.cap&&!confirm('الغرفة '+r.no+' مكتملة ('+r.cap+' أسرّة). إضافة رغم ذلك؟'))return;x.room=r.no;save();draw()}
function roomOut2(id){const x=S.pil.find(p=>p.id==id);if(x){x.room='';save();draw()}}
function dropTo(ev,i){ev.preventDefault();const id=+ev.dataTransfer.getData('text');if(i<0)roomOut2(id);else putRoom(id,i)}
const HOTEL='التامور';
function autoOne(x){const r=x.room?null:S.rooms.find(r=>occ(r.no)<r.cap);if(r)x.room=r.no;const b=S.bus.find(b=>seats(b.no)<b.cap);if(b){x.bus=b.no;const u=S.pil.filter(p=>p.bus==b.no&&p.seat).map(p=>+p.seat);let s=1;while(u.includes(s))s++;x.seat=String(s)}}
function setAuto(k,v){if(API&&k=='onSeat'&&v){const c=S.pil.filter(x=>x.bus&&x.seat&&!x.st&&!x.sent).length;if(c&&!confirm('سيُرسل تلقائيًا لـ '+c+' حاج لديهم مقعد ولم تصلهم رسالة. متابعة؟')){draw();return}}S.auto[k]=v;save();draw()}
async function loadLog(){try{const l=await hit('GET','/api/log');const e=$('#alog');if(e)e.innerHTML=l.map(x=>`<div class="att" style="cursor:default"><span>${esc(x.txt)}</span><span class="sub" style="margin:0">${fmt(x.ts)}</span></div>`).join('')||'لا نشاط بعد'}catch(e){}}
function up(id,k,v,quiet){const x=S.pil.find(p=>p.id==id);x[k]=v;save();if(!quiet)draw()}
function addP(){const n=$('#an').value.trim(),p=$('#ap').value.trim();if(!n||!p)return;let rm=($('#ar')||{}).value||'';const ty=+(($('#at')||{}).value||0);LASTTYPE=ty;if(!rm&&ty){rm=pickRoom(ty);if(!rm)return alert('لا توجد غرفة '+tname(ty)+' متاحة')}const id=nextId();LASTROOM=rm;S.pil.push({id,n,p,room:rm,bus:'',seat:'',bag:'BG-'+String(id).padStart(3,'0'),bs:0,sent:0});if(S.auto&&S.auto.assign)autoOne(S.pil[S.pil.length-1]);save();draw();const fe=$('#an');if(fe&&fe.focus)fe.focus()}
function delP(id){S.pil=S.pil.filter(p=>p.id!=id);save();draw()}
function addR(){const no=$('#rn').value.trim();if(!no)return;S.rooms.push({no,hotel:$('#rh').value.trim()||'—',cap:+$('#rc').value||4});save();draw()}
function addB(){const no=$('#bn').value.trim();if(!no)return;S.bus.push({no,time:$('#bt').value,cap:+$('#bc').value||45,dest:$('#bd').value.trim()||'—'});save();draw()}
function autoRoom(){S.pil.filter(x=>!x.room).forEach(x=>{const r=S.rooms.find(r=>occ(r.no)<r.cap);if(r)x.room=r.no});save();draw()}
function autoSeat(){S.bus.forEach(b=>{const l=S.pil.filter(x=>x.bus==b.no);let n=1;l.forEach(x=>{if(!x.seat)x.seat=String(n);n++})});
S.pil.filter(x=>!x.bus).forEach(x=>{const b=S.bus.find(b=>seats(b.no)<b.cap);if(b){x.bus=b.no;x.seat=String(seats(b.no))}});save();draw()}
boot();
</script>
